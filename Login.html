</head>
<body>
    <h2>Form Login</h2>

    <form action="index.html" method="post" enctype="multipart/from-data">
        <fieldset>
            <legend>Login</legend>
            <label for="nama">Username</label> :
            <input type="text" id="nama" name="nama" placeholder="Masukan username" required><br><br>

            <label for="password">Password</label> :
            <input type="text" id="nama" name="password" placeholder="Masukan Password" required><br><br>

            <input type="checkbox" name="Remember me"> Remember me <br>

            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
