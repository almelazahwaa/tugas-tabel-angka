<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form contact</title>
</head>
<body>
    <h2>Form Contact</h2>
    <form action="index.html" method="post" enctype="multipart/from-data">
        <fieldset>
            <legend>Contact</legend>
            <label for="nama">Nama</label> :
            <input type="text" id="nama" name="nama" placeholder="Masukan nama" required><br><br>

            <label for="email">Email</label> :
            <input type="text" id="email" name="email" placeholder="Masukan email" required><br><br>

            <label for="subject">Subject</label> :
            <input type="text" id="subject" name="subject" placeholder="Masukan subject" required><br><br>

            <label for="pesan">Pesan:</label><br>
            <textarea type="text" id="nama" name="nama" placeholder="Tulis Pesan Anda..." required></textarea><br><br>

            <button type="submit">Send</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
</html>
